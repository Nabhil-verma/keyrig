<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0E1116" />
    <title>keyrig — BYOK AI harness</title>
    <meta name="description" content="One key connects to many AI models. The harness routes each request." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="keyrig" />
    <meta property="og:title" content="keyrig — One key. Every model." />
    <meta
      property="og:description"
      content="A bring-your-own-key AI harness. Your keys stay in this browser, and every answer shows its model, its key label and its cost."
    />
    <meta property="og:image" content="/brand/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="keyrig: one key, every model." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="keyrig — One key. Every model." />
    <meta name="twitter:description" content="Your keys stay in this browser. Every answer shows its model and its cost." />
    <meta name="twitter:image" content="/brand/og-card.png" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("keyrig.theme");
          document.documentElement.dataset.theme = stored === "light" ? "light" : "dark";
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
