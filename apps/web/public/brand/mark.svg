<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- keyrig standalone mark (64x64 grid) -->
  <!-- Ring outer R=14, stroke=4, inner gap R=10 -->
  <circle cx="22" cy="32" r="12" fill="none" stroke="#F5B83D" stroke-width="4"/>
  <!-- Key shaft -->
  <line x1="34" y1="32" x2="58" y2="32" stroke="#F5B83D" stroke-width="3" stroke-linecap="butt"/>
  <!-- Uneven teeth hanging below -->
  <line x1="48" y1="32" x2="48" y2="39" stroke="#F5B83D" stroke-width="2.5" stroke-linecap="butt"/>
  <line x1="54" y1="32" x2="54" y2="42" stroke="#F5B83D" stroke-width="2.5" stroke-linecap="butt"/>
  <!-- Hub and 3 links at 120 degrees -->
  <!-- Link 0 deg (34, 32) -->
  <line x1="22" y1="32" x2="34" y2="32" stroke="#3DD6C6" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Link 120 deg (16, 42.3923) -->
  <line x1="22" y1="32" x2="16" y2="42.3923" stroke="#3DD6C6" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Link 240 deg (16, 21.6077) -->
  <line x1="22" y1="32" x2="16" y2="21.6077" stroke="#3DD6C6" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center Hub Dot -->
  <circle cx="22" cy="32" r="2.5" fill="#3DD6C6"/>
  <!-- Node Dots at ring inner edge -->
  <circle cx="34" cy="32" r="1.8" fill="#3DD6C6"/>
  <circle cx="16" cy="42.3923" r="1.8" fill="#3DD6C6"/>
  <circle cx="16" cy="21.6077" r="1.8" fill="#3DD6C6"/>
</svg>